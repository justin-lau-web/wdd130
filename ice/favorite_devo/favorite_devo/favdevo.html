<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
           <!-- Header Row -->
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <!-- Data Row 1 -->
          <tr>
            <td>Brad R. Wilcox</td>
            <td>His Grace Is Sufficient</td>
            <td>BYU</td>
            <td>2011</td>
          </tr>
          <!-- Data Row 2 -->
          <tr>
            <td>David A. Bednar</td>
            <td>“Look unto Me in Every Thought; Doubt Not, Fear Not”</td>
            <td>BYU</td>
            <td>2021</td>
          </tr>
          <tr>
            <td>Jeffery R. Holland</td>
            <td>“Remember Lot’s Wife”</td>
            <td>BYU</td>
            <td>2009</td>
          </tr>
        </table>
        <form action="#" method="post">

          <label for="sfname">Speaker's First Name:</label>
          <input type="text" id="sfname" name="sfname">

          <label for="slname">Speaker's Last Name:</label>
          <input type="text" id="slname" name="slname">

          <label for="date">Year:</label>
          <input type="text" id="date" name="date">

          <input type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
